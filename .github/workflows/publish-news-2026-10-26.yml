name: Publish scheduled editorial articles

on:
  schedule:
    # GitHub Actions uses UTC. The script enforces each Costa Rica release time.
    - cron: '*/5 * 26 10 *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out public site
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Decrypt and publish articles due now
        id: release
        env:
          NEWS_RELEASE_KEY: ${{ secrets.NEWS_RELEASE_KEY }}
        run: |
          python -m pip install --disable-pip-version-check cryptography==46.0.3
          python .github/scripts/publish-news-2026-10-26.py
      - name: Configure GitHub Pages
        if: steps.release.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - name: Upload public site
        if: steps.release.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy public site
        if: steps.release.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
